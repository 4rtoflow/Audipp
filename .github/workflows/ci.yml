name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test PR validation
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate PR requirements and evidence
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/check_pr.py

  android:
    name: Failure injection (${{ matrix.failure }})
    strategy:
      fail-fast: false
      matrix:
        failure: [build, unit, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null'
      - name: Detect dependency changes
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD -- '*.gradle.kts' 'gradle/*.toml' 'gradle/wrapper/*' '*.lockfile')
            if [[ -n "$files" ]]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Inject expected failure
        env:
          FAILURE_CASE: ${{ matrix.failure }}
        run: |
          case "$FAILURE_CASE" in
            build)
              printf '%s\n' 'package com.audipp' 'val ciFailure: MissingCiType = error("Expected build failure")' > app/src/main/java/com/audipp/CiFailure.kt
              ;;
            unit)
              printf '%s\n' 'package com.audipp' 'class CiFailureTest { @org.junit.Test fun fails() { org.junit.Assert.fail("Expected unit failure") } }' > app/src/test/java/com/audipp/CiFailureTest.kt
              ;;
            lint)
              mkdir -p app/src/main/res/layout
              printf '%s\n' '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><View android:id="@+id/ci_duplicate" android:layout_width="1dp" android:layout_height="1dp"/><View android:id="@+id/ci_duplicate" android:layout_width="1dp" android:layout_height="1dp"/></LinearLayout>' > app/src/main/res/layout/ci_failure.xml
              ;;
          esac
      - name: Debug build, unit tests, lint, unsigned Release build
        env:
          DEPENDENCIES_CHANGED: ${{ steps.dependencies.outputs.changed }}
        run: |
          lock_args=()
          if [[ "$DEPENDENCIES_CHANGED" == 'true' ]]; then
            lock_args+=(--write-locks)
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease "${lock_args[@]}"
      - name: Verify committed dependency locks
        run: git diff --exit-code -- '*.lockfile'
      - name: Upload test and lint reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ matrix.failure }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CI APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-apks-not-for-distribution-${{ matrix.failure }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
