name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test PR validation
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate PR requirements and evidence
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/check_pr.py

  android:
    name: Android build, unit tests, lint, release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null'
      - name: Detect dependency changes
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD -- '*.gradle.kts' 'gradle/*.toml' 'gradle/wrapper/*' '*.lockfile')
            if [[ -n "$files" ]]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Debug build, unit tests, lint, unsigned Release build
        env:
          DEPENDENCIES_CHANGED: ${{ steps.dependencies.outputs.changed }}
        run: |
          lock_args=()
          if [[ "$DEPENDENCIES_CHANGED" == 'true' ]]; then
            lock_args+=(--write-locks)
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease "${lock_args[@]}"
      - name: Verify committed dependency locks
        run: git diff --exit-code -- '*.lockfile'
      - name: Upload test and lint reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CI APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-apks-not-for-distribution
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
